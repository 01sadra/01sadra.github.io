baseURL = "/"
title = "Sadra.blog"
theme = "PaperMod"

languageCode = "fa-IR"
defaultContentLanguage = "fa"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 5

mainSections = ["blog", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Sadra.blog"
  description = "وبلاگ شخصی سدره علی‌آبادی"
  keywords = ["Blog", "Hugo", "PaperMod"]
  author = "Sadra Aliabadi"
  images = ["/images/share.png"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "سلام به وبلاگ من 👋"
    Content = "تو این وبلاگ همه نوشته‌هام رو به ترتیب زمان می‌تونی ببینی."


  [params.assets]
    favicon = "/images/favicon.png"
      customCSS = ["/css/rtl.css"]
    favicon16x16 = "/images/favicon-16x16.png"
    favicon32x32 = "/images/favicon-32x32.png"
    apple_touch_icon = "/images/apple-touch-icon.png"
    safari_pinned_tab = "/images/safari-pinned-tab.svg"

  [params.label]
    text = "Home"
    icon = "/apple-touch-icon.png"
    iconHeight = 35

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/01sadra"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/username"

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

  [params.editPost]
    URL = "https://github.com/01sadra/blog-hugo/edit/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    limit = 10
    keys = ["title", "permalink", "summary", "content"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]

  [[menu.main]]
    identifier = "categories"
    name = "دسته‌بندی‌ها"
    url = "/categories/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "برچسب‌ها"
    url = "/tags/"
    weight = 20