baseURL = "https://01sadra.github.io/"
title = "Sadra Blog"
languageCode = "fa-IR"
defaultContentLanguage = "fa"
theme = "PaperMod"

[languages]
  [languages.fa]
    languageName = "فارسی"
    languageDirection = "rtl"
    weight = 1

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

summaryLength = 0

[taxonomies]
  category = "categories"
  tag = "tags"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]
  env = "production"
  title = "Sadra Blog"
  description = "وبلاگ صدرا علی‌آبادی"
  keywords = ["Blog", "Hugo", "PaperMod", "Persian", "فارسی"]
  author = "Sadra Aliabadi"
  defaultTheme = "light"
  disableThemeToggle = false
  
  # Main sections to display on homepage
  mainSections = ["blog"]

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = false
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  
  # Persian typography and readability settings
  ShowPostDescription = true
  hidePostNavigation = false

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xhtml = false
    [markup.goldmark.extensions]
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = false
    [markup.goldmark.parser]
      attribute = true
      autoHeadingID = true
      wrapStandAloneImageWithinParagraph = false
      autoHeadingIDType = "github"
  [markup.tableOfContents]
    endLevel = 6
    startLevel = 2

[frontmatter]
  summary = [""]

[permalinks]
  blog = "/:slug/"

[minify]
  disableXML = false
  minifyOutput = true

[pagination]
  pagerSize = 20

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[services.rss]
  limit = 20

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[params.assets]
  customCSS = ["/css/rtl.css"]

[menu]

  [[menu.main]]
    identifier = "categories"
    name = "دسته‌بندی‌ها"
    url = "/categories/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "برچسب‌ها"
    url = "/tags/"
    weight = 20